syntax = "proto3";

package orderpay.v1;

import "orderpay/status.proto";
import "fino/options.proto";
import "fino/core/time.proto";
import "google/api/annotations.proto";

option go_package = "github.com/fino-io/orderpay/go/orderpay/v1;orderpay";

// 商户身份只取鉴权上下文。订单号与订单ID分别保证创建和支付幂等。
service OrderpayService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (google.api.http) = {post: "/orderpay/v1/orders" body: "order"};
  }

  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (google.api.http) = {get: "/orderpay/v1/orders/{order_id}"};
  }

  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse) {
    option (google.api.http) = {get: "/orderpay/v1/orders"};
  }

  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse) {
    option (google.api.http) = {post: "/orderpay/v1/orders/{order_id}:cancel"};
  }

  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse) {
    option (google.api.http) = {post: "/orderpay/v1/orders/{order_id}/payments"};
  }

  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse) {
    option (google.api.http) = {get: "/orderpay/v1/admin/audit-events"};
  }
}

// 同商户订单号、同内容返回已有订单；内容不同返回ORDER_CONFLICT。
message CreateOrderRequest {
  OrderInput order = 1 [(fino.validate) = {required: true}];
}

message CreateOrderResponse {
  OrderView order = 1;
}

message OrderInput {
  string merchant_order_no = 1 [(fino.validate) = {required: true max: 128}];
  // 金额单位固定为人民币分。
  int64 amount_minor = 2 [(fino.validate) = {required: true min: 1 max: 100000000}];
  string description = 3 [(fino.validate) = {required: true max: 200}];
}

message OrderView {
  string id = 1;
  string merchant_order_no = 2;
  // 金额单位固定为人民币分。
  int64 amount_minor = 3;
  string description = 4;
  orderpay.OrderStatus status = 5;
  fino.core.Timestamp create_time = 98;
  fino.core.Timestamp update_time = 99;
}

message GetOrderRequest {
  string order_id = 1 [(fino.validate) = {required: true max: 36 uuid: true}];
}

message GetOrderResponse {
  OrderView order = 1;
  // 无支付记录时不设置；查询订单详情即可跟踪支付。
  PaymentView payment = 2;
}

message PaymentView {
  string id = 1;
  string order_id = 2;
  orderpay.PaymentStatus status = 3;
  string provider_reference = 4;
  fino.core.Timestamp create_time = 98;
  fino.core.Timestamp update_time = 99;
}

message ListOrdersRequest {
  orderpay.OrderStatus status = 1 [(fino.validate) = {omitempty: true oneof: "1 2 3"}];
  int32 page_size = 90 [(fino.validate) = {omitempty: true min: 1 max: 100}];
  string page_token = 91 [(fino.validate) = {omitempty: true max: 512}];
}

message ListOrdersResponse {
  repeated OrderView orders = 1;
  string next_page_token = 93;
}

message CancelOrderRequest {
  string order_id = 1 [(fino.validate) = {required: true max: 36 uuid: true}];
}

message CancelOrderResponse {
  OrderView order = 1;
}

// 每单只受理一笔支付；重复请求返回该支付的当前状态，不再次扣款。
message CreatePaymentRequest {
  string order_id = 1 [(fino.validate) = {required: true max: 36 uuid: true}];
}

message CreatePaymentResponse {
  PaymentView payment = 1;
}

// 管理员接口；游标绑定商户、资源等完整过滤条件。
message ListAuditEventsRequest {
  string merchant_id = 1 [(fino.validate) = {omitempty: true max: 36 uuid: true}];
  string resource_id = 2 [(fino.validate) = {omitempty: true max: 36 uuid: true}];
  int32 page_size = 90 [(fino.validate) = {omitempty: true min: 1 max: 100}];
  string page_token = 91 [(fino.validate) = {omitempty: true max: 512}];
}

message ListAuditEventsResponse {
  repeated AuditEventView events = 1;
  string next_page_token = 93;
}

message AuditEventView {
  string id = 1;
  string merchant_id = 2;
  string actor_id = 3;
  string action = 4;
  string resource_id = 5;
  string request_id = 6;
  string before_status = 7;
  string after_status = 8;
  string reason_code = 9;
  fino.core.Timestamp create_time = 98;
}

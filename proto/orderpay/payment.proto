syntax = "proto3";

package orderpay;

import "fino/core/time.proto";
import "fino/options.proto";
import "orderpay/status.proto";

option go_package = "github.com/fino-io/orderpay/go/orderpay;orderpay";

message Payment {
  option (fino.model) = {generate: true services: "OrderpayService"};

  string id = 1 [(fino.db) = {len: 36 comment: "主键及稳定渠道幂等键，服务端生成UUIDv7"}];
  string merchant_id = 2 [(fino.db) = {len: 36 comment: "订单所属商户UUID"}];
  string order_id = 3 [(fino.db) = {len: 36 comment: "订单UUID，每单一个支付意图" unique_index: "idx_payment_order"}];
  int64 amount_minor = 4 [(fino.db) = {comment: "受理金额快照，人民币分，受理后不可修改"}];
  string mandate_reference = 5 [(fino.db) = {len: 128 comment: "上游已签约授权的不可变引用，不保存授权凭证原文"}];
  string channel_account_id = 6 [(fino.db) = {len: 128 comment: "已与授权绑定的不可变渠道账户配置引用"}];
  PaymentStatus status = 7 [(fino.db) = {comment: "支付状态，技术异常保持待确认" index: "idx_payment_due"}];
  string provider_reference = 8 [(fino.db) = {len: 200 comment: "稳定渠道支付对象标识，无独立对象时使用流水号，首次取得后不可替换"}];
  string reason_code = 9 [(fino.db) = {len: 64 comment: "服务端脱敏原因码，需核查时为RECONCILIATION_REQUIRED"}];
  fino.core.Timestamp submitted_at = 10 [(fino.db) = {null: true comment: "首次准备提交时间，重启不重置"}];
  fino.core.Timestamp retry_deadline_at = 11 [(fino.db) = {null: true comment: "首次提交前确定的保守幂等重试截止时间，空值禁止再次提交"}];
  int32 submit_attempts = 12 [(fino.db) = {comment: "已预留的提交调用轮次，调用渠道前递增，重启不重置"}];
  fino.core.Timestamp next_check_at = 13 [(fino.db) = {null: true comment: "下一次提交或查询时间，终态为空" index: "idx_payment_due"}];
  int32 check_attempts = 14 [(fino.db) = {comment: "累计查询次数，用于退避和核查告警，重启不重置"}];

  fino.core.Timestamp create_time = 98 [(fino.db) = {comment: "创建时间，UTC"}];
  fino.core.Timestamp update_time = 99 [(fino.db) = {comment: "最后更新时间，UTC"}];
}

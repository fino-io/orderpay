syntax = "proto3";

package orderpay;

import "fino/core/time.proto";
import "fino/options.proto";
import "orderpay/status.proto";

option go_package = "github.com/fino-io/orderpay/go/orderpay;orderpay";

message Payment {
  option (fino.model) = {generate: true services: "OrderpayService"};

  string id = 1 [(fino.db) = {len: 36 comment: "主键及渠道交易标识，服务端生成UUIDv7"}];
  string merchant_id = 2 [(fino.db) = {len: 36 comment: "订单所属商户UUID"}];
  string order_id = 3 [(fino.db) = {len: 36 comment: "订单UUID，同时作为支付受理幂等标识" unique_index: "idx_payment_order"}];
  string channel_account_id = 4 [(fino.db) = {len: 128 comment: "不可变渠道账户引用，关联渠道类型及凭证配置"}];
  PaymentStatus status = 5 [(fino.db) = {comment: "支付状态，待确认不等于失败" index: "idx_payment_due"}];
  string provider_reference = 6 [(fino.db) = {len: 200 comment: "确认后的渠道流水号，尚无结果时为空"}];
  fino.core.Timestamp submitted_at = 7 [(fino.db) = {comment: "首次准备提交渠道的时间，尚未准备时为空" null: true}];
  fino.core.Timestamp next_check_at = 8 [(fino.db) = {comment: "下一次提交或查询时间，终态为空" null: true index: "idx_payment_due"}];
  int32 check_attempts = 9 [(fino.db) = {comment: "累计查询次数，控制退避和告警，重启不重置"}];

  fino.core.Timestamp create_time = 98 [(fino.db) = {comment: "创建时间，UTC"}];
  fino.core.Timestamp update_time = 99 [(fino.db) = {comment: "最后更新时间，UTC"}];
}

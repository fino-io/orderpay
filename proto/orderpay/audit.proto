syntax = "proto3";

package orderpay;

import "fino/core/time.proto";
import "fino/options.proto";

option go_package = "github.com/fino-io/orderpay/go/orderpay;orderpay";

message AuditEvent {
  option (fino.model) = {generate: true services: "OrderpayService"};

  string id = 1 [(fino.db) = {len: 36 comment: "主键，UUIDv7，游标及归档去重标识"}];
  string merchant_id = 2 [(fino.db) = {len: 36 comment: "资源所属商户 UUID，系统事件可为空"}];
  string actor_id = 3 [(fino.db) = {len: 128 comment: "已认证操作者或系统主体标识"}];
  string action = 4 [(fino.db) = {len: 64 comment: "业务操作名称"}];
  string resource_id = 5 [(fino.db) = {len: 36 comment: "业务资源 UUID"}];
  string request_id = 6 [(fino.db) = {len: 128 comment: "服务端请求关联标识"}];
  string before_status = 7 [(fino.db) = {len: 64 comment: "变更前状态名称"}];
  string after_status = 8 [(fino.db) = {len: 64 comment: "变更后状态名称"}];
  string reason_code = 9 [(fino.db) = {len: 64 comment: "脱敏原因码，不保存凭证或原始报文"}];

  fino.core.Timestamp create_time = 98 [(fino.db) = {comment: "创建时间，UTC"}];
}

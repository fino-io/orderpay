syntax = "proto3";

package orderpay;


option go_package = "github.com/fino-io/orderpay/go/orderpay;orderpay";

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING_PAYMENT = 1;
  ORDER_STATUS_PAID = 2;
  ORDER_STATUS_CANCELLED = 3;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_CREATED = 1;
  PAYMENT_STATUS_PROCESSING = 2;
  PAYMENT_STATUS_UNKNOWN = 3;
  PAYMENT_STATUS_REVIEW = 4;
  PAYMENT_STATUS_SUCCEEDED = 5;
  PAYMENT_STATUS_DECLINED = 6;
}

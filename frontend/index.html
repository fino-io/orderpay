<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link id="fino-favicon" rel="icon" type="image/png" href="/fino-mark.png?v=4" />
    <title>orderpay | fino</title>
    <script>
      function setFavicon(isDark) {
        document.getElementById("fino-favicon").href = isDark
          ? "/fino-mark-dark.png?v=4"
          : "/fino-mark.png?v=4";
      }

      try {
        const theme = localStorage.getItem("fino-theme");
        const isDark = theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
        setFavicon(isDark);
      } catch {
        const isDark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
        setFavicon(isDark);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>

{{- $gateway := .Values.gateway | default dict -}}
{{- if $gateway.enabled -}}
{{- if .Values.ingress.enabled -}}{{- fail "gateway and ingress cannot both be enabled" -}}{{- end -}}
{{- $names := dict -}}
{{- range $route := $gateway.routes -}}
{{- if hasKey $names $route.name -}}{{- fail "gateway route names must be unique" -}}{{- end -}}
{{- $_ := set $names $route.name true -}}
{{- $name := printf "%s-%s" (include "fino.fullname" $) $route.name -}}
{{- if gt (len $name) 63 -}}
{{- $name = printf "%s-%s" ($name | trunc 54 | trimSuffix "-") ($name | sha256sum | trunc 8) -}}
{{- end -}}
{{- if and (eq $route.backend "frontend") (not $.Values.frontend.enabled) -}}
{{- fail "gateway frontend route requires frontend.enabled=true" -}}
{{- end -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "fino.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gateway.parentRef.name | quote }}
      {{- with $gateway.parentRef.namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with $gateway.parentRef.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  hostnames:
    {{- toYaml $route.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $route.pathPrefix | default "/" | quote }}
      backendRefs:
        - name: {{ include "fino.fullname" $ }}-{{ $route.backend }}
          port: {{ if eq $route.backend "frontend" }}80{{ else }}{{ $.Values.ports.http }}{{ end }}
{{ end -}}
{{- end -}}

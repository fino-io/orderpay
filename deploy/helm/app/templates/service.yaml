apiVersion: v1
kind: Service
metadata:
  name: {{ include "fino.fullname" . }}-server
  labels:
    {{- include "fino.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "fino.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
    - name: grpc
      port: {{ .Values.ports.grpc }}
      targetPort: grpc
